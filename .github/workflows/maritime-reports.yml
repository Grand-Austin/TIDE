name: AEMET maritime reports
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --no-sync python -m pipeline.aemet bulletin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aemet-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/raw/aemet/
          if-no-files-found: error
          retention-days: 90
