# Runs on a fresh clone what every developer runs locally (README, Setup), so "works on my machine" breaks here first.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Prepare the S175 vessel (pinned MSS files, checksums verified)
        run: uv run --no-sync python -m pipeline.prepare_vessel
      - name: Tests
        run: uv run --no-sync python -m pytest -q
      - name: Scripted game smoke run (2 simulated minutes, no model calls)
        run: |
          echo '[{"heading_deg": 155, "speed_knots": 5.8315, "until_s": 120}]' > "$RUNNER_TEMP/smoke.json"
          uv run --no-sync python -m game --script "$RUNNER_TEMP/smoke.json" --session "$RUNNER_TEMP/smoke"
