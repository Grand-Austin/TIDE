<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIDE 3D replay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8d99a2; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .hud { position: fixed; left: 12px; top: 12px; max-width: calc(100% - 24px); padding: 10px 14px; border-radius: 6px;
         background: rgba(11, 22, 34, 0.8); color: #d6e2ee; font: 13px/1.6 ui-monospace, monospace; }
  .bar { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
         padding: 8px 12px; border-radius: 6px; background: rgba(11, 22, 34, 0.8); color: #d6e2ee; font-size: 13px; }
  .bar button { min-width: 44px; height: 36px; border: 1px solid #2b4660; border-radius: 4px; background: #0e1b29; color: #d6e2ee; font: inherit; }
  .bar button[aria-pressed="true"] { background: #2b4660; color: #fff; }
  .bar input[type="range"] { flex: 1 1 240px; min-width: 0; }
  .credit { flex-basis: 100%; color: #a9bccd; font-size: 11px; }
  #fps { position: fixed; right: 12px; top: 12px; color: #0b1622; font: 12px ui-monospace, monospace; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="hud" aria-live="off">
  <div id="clock">Loading…</div>
  <div id="helm"></div>
  <div id="motion"></div>
  <div id="sea"></div>
  <div id="cargo"></div>
  <div id="weather"></div>
</div>
<div id="fps"></div>
<div class="bar">
  <label for="scene" style="position:absolute;width:1px;height:1px;overflow:hidden">Scene</label>
  <select id="scene" style="height:36px;background:#0e1b29;color:#d6e2ee;border:1px solid #2b4660;border-radius:4px">
    <option value="biscay-20261022-21">Storm 22 Oct 2026, Ushant</option>
    <option value="biscay-20260123-06">Storm 23 Jan 2026, Biscay</option>
    <option value="biscay-20260108-18">Storm 8 Jan 2026, Ushant</option>
    <option value="biscay-20251218-03">Storm 18 Dec 2025, Celtic Sea</option>
    <option value="replay">Menorca 9 Sep 2026 (recorded game)</option>
  </select>
  <button id="play" type="button">Pause</button>
  <span>Rate</span>
  <button type="button" data-rate="1" aria-pressed="false">1×</button>
  <button type="button" data-rate="5" aria-pressed="false">5×</button>
  <button type="button" data-rate="20" aria-pressed="true">20×</button>
  <button type="button" data-rate="60" aria-pressed="false">60×</button>
  <label for="scrub" style="position:absolute;width:1px;height:1px;overflow:hidden">Replay time</label>
  <input id="scrub" type="range" min="0" step="1" value="0">
  <div class="credit" id="credit"></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
