[project]
name = "tide"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Weixuan Ding", email = "116479980+Grand-Austin@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "copernicusmarine>=2.5.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
    "xarray>=2026.9.0",
]

[project.scripts]
tide = "tide:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
